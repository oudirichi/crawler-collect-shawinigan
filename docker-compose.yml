services:
  # ─── CI ─────────────────────────────────────────────────────────────────────
  collect-ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: ci
    image: collect:ci
    profiles: [ci]

  # ─── Prod ───────────────────────────────────────────────────────────────────
  collect:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: collect:latest
    environment:
      - ADDRESS=${ADDRESS:?définir ADDRESS, ex. ADDRESS="742 Avenue des Pins"}
    profiles: [prod]
